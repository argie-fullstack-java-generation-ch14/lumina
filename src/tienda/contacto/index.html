<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto · Lumina</title>

  <!-- Bootstrap va primero: el Reboot no debe pisar los estilos -->
  <link rel="stylesheet" href="../../css/bootstrap.min.css">

  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="contacto.css">
</head>

<body>

  <header id="header"></header>

  <!-- Contenido de Contacto -->
  <main class="contact-page">
    <div class="container contact-layout">

      <div class="contact-intro">
        <h1 class="contact-title">Hablemos de tu vela</h1>
        <p class="contact-lead">
          Cuéntanos si tienes una duda sobre un pedido o si quieres una vela hecha a tu medida.
        </p>
      </div>

      <div class="contact-panel">

        <!-- Aquí va el link de Formspree, en el action del formulario -->
        <form class="contact-form" id="contact-form" action="https://formspree.io/f/xwlvaoyv" method="POST" novalidate>
          <input type="hidden" name="_subject" value="Nuevo mensaje desde Lumina">

          <div class="contact-field">
            <label class="contact-label" for="contact-name">Nombre</label>
            <input class="contact-input" id="contact-name" name="name" type="text" autocomplete="name" maxlength="60" placeholder="Ej: Laura Gómez" aria-describedby="contact-name-error" required>
            <p class="contact-error" id="contact-name-error"></p>
          </div>

          <div class="contact-field">
            <label class="contact-label" for="contact-email">Correo electrónico</label>
            <input class="contact-input" id="contact-email" name="email" type="email" autocomplete="email" maxlength="100" placeholder="nombre@correo.com" aria-describedby="contact-email-error" required>
            <p class="contact-error" id="contact-email-error"></p>
          </div>

          <div class="contact-field">
            <label class="contact-label" for="contact-phone">Teléfono</label>
            <input class="contact-input" id="contact-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" placeholder="Ej: 300 123 4567" aria-describedby="contact-phone-error" required>
            <p class="contact-error" id="contact-phone-error"></p>
          </div>

          <div class="contact-field">
            <label class="contact-label" for="contact-message">Mensaje</label>
            <textarea class="contact-input contact-textarea" id="contact-message" name="message" rows="5" maxlength="500" placeholder="Cuéntanos en qué podemos ayudarte" aria-describedby="contact-message-error" required></textarea>
            <p class="contact-error" id="contact-message-error"></p>
          </div>

          <p class="contact-form-error" id="contact-form-error" role="alert"></p>

          <button class="contact-button" type="submit">Enviar mensaje</button>
        </form>

        <!-- Esto sale mientras se envía el mensaje (el hámster) -->
        <div class="contact-state" id="contact-sending" hidden>
          <div class="hamster-wheel-box" role="img" aria-label="Hámster corriendo en una rueda">
            <div class="hamster-wheel"></div>
            <div class="hamster">
              <div class="hamster-part hamster-body">
                <div class="hamster-part hamster-head">
                  <div class="hamster-part hamster-ear"></div>
                  <div class="hamster-part hamster-eye"></div>
                  <div class="hamster-part hamster-nose"></div>
                </div>
                <div class="hamster-part hamster-limb-fr"></div>
                <div class="hamster-part hamster-limb-fl"></div>
                <div class="hamster-part hamster-limb-br"></div>
                <div class="hamster-part hamster-limb-bl"></div>
                <div class="hamster-part hamster-tail"></div>
              </div>
            </div>
            <div class="hamster-spoke"></div>
          </div>
          <h2 class="contact-state-title" id="contact-sending-title" tabindex="-1">Enviando tu mensaje…</h2>
        </div>

        <!-- Esto sale cuando Formspree confirma que el mensaje se envió -->
        <div class="contact-state" id="contact-success" hidden>
          <h2 class="contact-state-title" id="contact-success-title" tabindex="-1">¡Mensaje enviado!</h2>
          <p class="contact-state-text" id="contact-success-text"></p>
          <button class="contact-button" type="button" id="contact-again">Enviar otro mensaje</button>
        </div>

      </div>
    </div>
  </main>

  <footer id="footer"></footer>

  <!-- Bootstrap va primero: el modal usa su API -->
  <script src="../../js/bootstrap.bundle.min.js"></script>
  <script src="../../js/ui.js"></script>
  <script src="../../js/main.js"></script>
  <script src="../../js/carrito.js"></script>
  <script src="contacto.js"></script>
</body>

</html>
