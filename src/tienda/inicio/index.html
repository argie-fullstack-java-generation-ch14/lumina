<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio · Lumina</title>

  <!-- Bootstrap va primero: su Reboot no debe pisar tus estilos -->
  <link rel="stylesheet" href="../../css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="inicio.css">
</head>

<body>

  <header id="header"></header>

  <main>

    <!-- ============ BANNER ============ -->
    <section class="home-hero" id="home-hero" aria-label="Bienvenida a Lumina">
      <!-- Foto de las velas: queda fija a la derecha y se difumina hacia la izquierda -->
      <div class="home-hero-photo" aria-hidden="true">
        <img class="home-hero-img"
             src="../../assets/img/velas-lumina.jpg"
             alt="" draggable="false">
        <!-- Brillo de cada llama (--x e --y son su posición dentro de la foto) -->
        <span class="candles-flame" style="--x: 65.3%; --y: 14%; --d: 0s"></span>
        <span class="candles-flame" style="--x: 36.4%; --y: 40.8%; --d: -0.9s"></span>
        <span class="candles-flame" style="--x: 85.3%; --y: 46.3%; --d: -1.7s"></span>
        <span class="candles-flame" style="--x: 55.5%; --y: 61.1%; --d: -0.4s"></span>
      </div>

      <div class="home-hero-inner">

        <!-- Textos -->
        <div class="home-hero-copy">
          <!-- inicio.js separa el título en letras para el efecto de humo -->
          <h1 class="home-hero-title" data-smoke-type>Find Your Light, Feel your Wellness</h1>

          <!-- inicio.js separa esta frase en letras para que suban una por una -->
          <p class="home-hero-lead" data-split>Bienvenido a Lumina, velas personalizadas para tu bienestar.</p>

          <a class="home-hero-button" href="../catalogo/index.html">Descubre más</a>
        </div>

      </div>
    </section>

  </main>

  <footer id="footer"></footer>

  <!-- Bootstrap va primero: el modal usa su API -->
  <script src="../../js/bootstrap.bundle.min.js"></script>
  <script src="../../js/ui.js"></script>
  <script src="../../js/main.js"></script>
  <script src="../../js/carrito.js"></script>
  <script src="splash-cursor.js"></script>
  <script src="inicio.js"></script>
</body>

</html>
