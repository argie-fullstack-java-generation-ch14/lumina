<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Catálogo | Lumina</title>

    <link rel="stylesheet" href="../../css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="catalogo.css">
</head>

<body>

    <header id="header"></header>

    <main class="catalog-page">

        <!-- Catálogo completo -->
        <section id="catalogo-completo" class="catalog-section" aria-labelledby="catalog-title">

            <div class="catalog-heading">
                <h2 id="catalog-title">Catálogo</h2>

                <a href="index.html" class="view-all-link">
                    Explora todo el catálogo
                    <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
                </a>
            </div>

            <div class="catalog-layout">

                <!-- Filtros e imagen sostenible -->
                <aside class="catalog-sidebar">

                    <div class="filters-panel">

                        <div class="filters-header">
                            <h3>Filtros</h3>
                        </div>

                        <!-- Filtros por experiencia -->
                        <div class="filter-group">

                            <h4>Experiencias</h4>

                            <label class="filter-option">
                                <input type="checkbox" name="category" value="bienestar">
                                Bienestar
                            </label>

                            <label class="filter-option">
                                <input type="checkbox" name="category" value="descanso">
                                Descanso
                            </label>

                            <label class="filter-option">
                                <input type="checkbox" name="category" value="mindfulness">
                                Mindfulness
                            </label>

                            <label class="filter-option">
                                <input type="checkbox" name="category" value="intencion">
                                Intención
                            </label>

                            <label class="filter-option">
                                <input type="checkbox" name="category" value="amor propio">
                                Amor propio
                            </label>

                        </div>

                        <!-- Filtros por temporada -->
                        <div class="filter-group">

                            <h4>Temporadas</h4>

                            <label class="filter-option">
                                <input type="checkbox" name="category" value="halloween">
                                Halloween
                            </label>

                            <label class="filter-option">
                                <input type="checkbox" name="category" value="navidad">
                                Navidad
                            </label>

                        </div>

                        <button type="button" id="clear-filters" class="clear-filters">
                            Limpiar filtros
                        </button>

                    </div>

                    <!-- Compromiso sostenible -->
                    <article class="sustainability-card">

                        <div class="sustainability-content">

                            <!-- Logo de Lumina -->
                            <div class="sustainability-logo">
                                <img
                                    src="https://res.cloudinary.com/zj7mojiw/image/upload/v1793051440/Lumina.png "
                                    alt="Logo de Lumina">
                            </div>

                            <h3>Compromiso sostenible</h3>

                            <p>
                                Nuestros frascos de vidrio son 100 %
                                reutilizables como macetas, porta objetos
                                o lapiceros una vez terminada la cera.
                            </p>

                        </div>

                    </article>

                </aside>

                <!-- Productos del catálogo -->
                <div class="catalog-products">

                    <div id="catalog-container" class="catalog-grid" aria-label="Productos del catálogo">
                    </div>

                    <p id="empty-results" class="empty-results" hidden>
                        No encontramos velas con estos filtros.
                        Intenta seleccionar otras opciones.
                    </p>

                </div>

            </div>

        </section>

    </main>

    <footer id="footer"></footer>

    <!-- Scripts del proyecto -->
    <script src="../../js/bootstrap.bundle.min.js"></script>
    <script src="../../js/ui.js"></script>
    <script src="../../js/main.js"></script>
    <script src="../../js/carrito.js"></script>
    <script src="../../js/velas.js"></script>
    <script src="catalogo.js"></script>

</body>

</html>
