<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle de producto · Lumina</title>

  <!-- Bootstrap va primero: su Reboot no debe pisar tus estilos -->
  <link rel="stylesheet" href="../../../css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="../../../css/main.css">
  <link rel="stylesheet" href="../../../css/components.css">
  <link rel="stylesheet" href="producto.css">
  <link rel="stylesheet" href="../../../componentes/carrito/card-promo/card-promo.css">
</head>

<body>

  <header id="header"></header>

  <main class="container my-5">

    <div class="container my-5">
      <div class="row align-items-center g-4">

        <!-- BLOQUE 1: Imagen Principal (Columna Izquierda) -->
        <!-- En móvil ocupa todo el ancho, en lg (desktop) ocupa 3 columnas -->
        <div class="col-12 col-lg-3 col-xxl-4">
          <div class="p-3 border rounded bg-light text-center" style="min-height: 400px;">
            <span class="text-muted">[ Skeleton: Componente de Imagen ]</span>
          </div>
        </div>

        <!-- BLOQUE 2: Información del Producto, Precio y Botón (Columna Central) -->
        <!-- En móvil ocupa todo el ancho, en lg (desktop) ocupa 5 columnas -->
        <div class="col-12 col-lg-5 col-xxl-4">
          <div class="p-3 border rounded bg-light" style="min-height: 400px;">
            <span class="text-muted">[ Skeleton: Componente de Detalles, Precio y CTA ]</span>
          </div>
        </div>

        <!-- BLOQUE 3: Cards Promo y Recicla (Columna Derecha) -->
        <!-- En móvil ocupa todo el ancho, en lg (desktop) ocupa 4 columnas -->
        <div class="col-12 col-lg-4 col-xxl-4">
          <div id="card-promo"></div>
          <div id="card-recicla"></div>
        </div>

      </div>
    </div>
  </main>

  <footer id="footer"></footer>

  <!-- Bootstrap va primero: el modal usa su API -->
  <script src="../../../js/bootstrap.bundle.min.js"></script>
  <script src="../../../js/ui.js"></script>
  <script src="../../../js/main.js"></script>
  <script src="../../../componentes/carrito/card-promo/card-promo.js"></script>
  <script src="../../../componentes/carrito/card-promo/card-recicla.js"></script>
  <script src="../../../js/carrito.js"></script>
  <script src="producto.js"></script>
</body>

</html>
