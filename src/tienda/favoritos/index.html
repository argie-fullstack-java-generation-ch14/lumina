<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Favoritos · Lumina</title>

  <!-- Bootstrap va primero: su Reboot no debe pisar tus estilos -->
  <link rel="stylesheet" href="../../css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../componentes/favoritos/item-favoritos/item-favoritos.css">
  <link rel="stylesheet" href="../../componentes/carrito/card-promo/card-promo.css">
  <link rel="stylesheet" href="../../componentes/carrito/productos-recomendados/productos-recomendados.css">
  <link rel="stylesheet" href="favoritos.css">
</head>

<body>

  <header id="header"></header>

  <main class="container my-5">

    <!-- FILA 1: Título "Favoritos" y Botón "Vaciar favoritos" (Alineados arriba al ancho de las 8 columnas) -->
    <div class="row mb-4">
      <div class="col-lg-8 d-flex justify-content-between align-items-center">
        <h1 class="cart-title m-0">Favoritos</h1>
        <button type="button" class="btn btn-clear-favoritos d-flex align-items-center gap-2">
          <i class="fa-solid fa-trash-can"></i>
          <span>Vaciar favoritos</span>
        </button>
      </div>
    </div>

    <!-- FILA 2: Contenido principal.
         Lista de favoritos. Se llena con template strings
         desde componentes/favoritos/item-favoritos. -->
    <div class="row g-4 align-items-start">

      <!-- COLUMNA IZQUIERDA
           Lista de favoritos. Se llena con template strings
           desde componentes/favoritos/item-favoritos. -->
      <section class="col-lg-8">
        <div id="favoritos-items-container" class="d-flex flex-column gap-3 cart-items-container"></div>
      </section>

      <!-- COLUMNA DERECHA
           Card Promo o Card Recicla: js/carrito.js elige una al azar
           (tipoCardAleatoria) y la inyecta en uno de estos contenedores. -->
      <section class="col-lg-4">
        <div id="card-promo"></div>
        <div id="card-recicla"></div>
      </section>

    </div>

    <!-- Productos recomendados: fuera de la fila principal para que ocupe
         todo el ancho del contenedor en desktop y mobile.
         Se llena desde componentes/carrito/productos-recomendados. -->
    <div id="productos-recomendados" class="mt-5"></div>

  </main>

  <footer id="footer"></footer>

  <!-- Scripts -->
  <script src="../../js/bootstrap.bundle.min.js"></script>
  <script src="../../js/ui.js"></script>

  <!-- Componente de favoritos (template strings) -->
  <script src="../../componentes/favoritos/item-favoritos/item-favoritos.js"></script>

  <!-- Cards promo / recicla (compartidas con el carrito) -->
  <script src="../../componentes/carrito/card-promo/card-promo.js"></script>
  <script src="../../componentes/carrito/card-promo/card-recicla.js"></script>
  <script src="../../componentes/carrito/productos-recomendados/productos-recomendados.js"></script>

  <script src="../../js/main.js"></script>
  <script src="../../js/velas.js"></script>
  <script src="../../js/carrito.js"></script>
  <script src="../../js/favoritos.js"></script>
  <script src="favoritos.js"></script>
</body>

</html>
