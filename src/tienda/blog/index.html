<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Blog · Lumina</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/icons/favicon.svg">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">

  <link rel="stylesheet" href="../../css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="blog.css">
  <link rel="stylesheet" href="../../componentes/blog-card/blog-card.css">
</head>

<body>

  <header id="header"></header>

  <main class="blog-page">

    <!-- Hero Section con fondo difuminado a ancho completo -->
    <section class="blog-hero text-center hero-bg-wrapper">
      <div class="container py-4">

        <h1 class="blog-title fw-bold">Blog lumina</h1>
        <p class="blog-lead text-muted">
          Tu rincón en Lumina. Ideas, consejos y pequeños rituales para transformar el ritmo de tu día a día.
        </p>
      </div>

      <!-- Galería decorativa flotante de extremo a extremo -->
      <div class="blog-hero-gallery container-fluid px-0 mt-4">
        <div class="blog-img-container d-flex align-items-end justify-content-between gap-3 flex-nowrap w-100 px-3">
          <img src="https://images.unsplash.com/photo-1522202176988-66273c2fd55f?q=80&w=400"
            class="hero-img hero-img-sm rounded-4" alt="Galería 1">
          <img src="https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?q=80&w=400"
            class="hero-img hero-img-md rounded-4" alt="Galería 2">
          <img src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?q=80&w=400"
            class="hero-img hero-img-lg rounded-4" alt="Galería 3 principal">
          <img src="https://images.unsplash.com/photo-1531403009284-440f080d1e12?q=80&w=400"
            class="hero-img hero-img-md rounded-4" alt="Galería 4">
          <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?q=80&w=400"
            class="hero-img hero-img-sm rounded-4" alt="Galería 5">
        </div>
      </div>
    </section>

    <!-- Contenido principal: Listado de artículos -->
    <div class="articles-container container">
      <h2 class="blog-articulos-title mt-2 mt-lg-5 mb-4">Articulos</h2>

      <div class="row g-4" id="articulos-container">
        <!-- Las tarjetas de artículos se renderizan desde articulos.json -->
      </div>
    </div>

  </main>

  <footer id="footer"></footer>

  <!-- Scripts -->
  <script src="../../js/bootstrap.bundle.min.js"></script>
  <script src="../../js/ui.js"></script>
  <script src="../../js/main.js"></script>
  <script src="../../js/carrito.js"></script>
  <script type="module" src="./blog.js"></script>
</body>

</html>
