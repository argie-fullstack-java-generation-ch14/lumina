
<!-- Componente Header — se inyecta en #header por ui.js.
     Rutas relativas a src/. -->

<div class="site-promo">
  10 % de descuento en tu próxima compra utilizando el código: LUMINA26
</div>

<div class="site-header">
  <div class="site-header-inner">

    <a class="site-logo" href="index.html" aria-label="Lumina, ir al inicio">
      <img class="site-logo-img" src="assets/img/lumina-logo.svg" alt="Lumina">
    </a>

    <button class="site-toggle" type="button"
      data-bs-toggle="collapse"
      data-bs-target="#site-menu"
      aria-controls="site-menu"
      aria-expanded="false"
      aria-label="Abrir menú">
      <span class="site-toggle-line"></span>
      <span class="site-toggle-line"></span>
      <span class="site-toggle-line"></span>
    </button>

    <div class="site-menu collapse" id="site-menu">

      <nav class="site-nav" aria-label="Principal">
        <a class="site-nav-link" href="tienda/catalogo/index.html" data-page="catalogo">Catálogo</a>
        <a class="site-nav-link" href="tienda/nosotros/index.html" data-page="nosotros">Nosotros</a>
        <a class="site-nav-link" href="tienda/blog/index.html" data-page="blog">Blog</a>
        <a class="site-nav-link" href="tienda/contacto/index.html" data-page="contacto">Contáctanos</a>
      </nav>

      <div class="site-actions">

        <!-- Carrito -->
        <a class="site-icon" href="tienda/carrito/index.html" aria-label="Carrito">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M2.5 3.5h2.4l2.2 11.2h10.6l2-8.2H6"/>
            <circle cx="9" cy="19.2" r="1.4"/>
            <circle cx="17" cy="19.2" r="1.4"/>
          </svg>
          <span class="site-cart-count" id="cart-count" hidden>0</span>
        </a>

        <!-- Favoritos -->
        <a class="site-icon" href="tienda/favoritos/index.html" aria-label="Favoritos">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M12 20.5S3.5 15.4 3.5 9.6A4.6 4.6 0 0 1 12 7.2a4.6 4.6 0 0 1 8.5 2.4C20.5 15.4 12 20.5 12 20.5Z"/>
          </svg>
        </a>

        <!-- Cuenta / Inicio de sesión -->
        <div class="dropdown site-account">

          <button class="site-icon site-account-link"
                  id="site-account-link"
                  type="button"
                  data-bs-toggle="dropdown"
                  data-bs-auto-close="true"
                  aria-expanded="false"
                  aria-label="Cuenta">

            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <circle cx="12" cy="8" r="4"/>
              <path d="M4.5 20.5c.9-4 3.8-6 7.5-6s6.6 2 7.5 6"/>
            </svg>

            <span id="site-account-name"></span>
          </button>

          <ul class="dropdown-menu dropdown-menu-end site-account-menu" id="site-account-menu">
            <li><a class="dropdown-item" id="site-account-login" href="tienda/login/index.html">Iniciar sesión</a></li>
            <li><a class="dropdown-item" id="site-account-register" href="tienda/registro/index.html">Registrarse</a></li>
            <li><a class="dropdown-item" id="site-account-profile" href="tienda/mi-cuenta/index.html" hidden>Mi cuenta</a></li>
          </ul>
        </div>

        <!-- Botón Cerrar sesión -->
        <button
          class="site-logout-button site-icon"
          id="site-logout-button"
          type="button"
          aria-label="Cerrar sesión"
          data-bs-toggle="tooltip"
          data-bs-placement="bottom"
          data-bs-title="Cerrar sesión"
          hidden>
          <i class="ri-logout-circle-r-line"></i>
        </button>

      </div>
    </div>
  </div>
</div>
